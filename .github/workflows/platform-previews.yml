name: Platform previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'macos/**', '.github/workflows/platform-previews.yml', 'lib/**', 'pubspec.*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android preview APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --no-pub
      - name: Verify packages
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/MusicTime-3.0.11-android-arm64-preview.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/MusicTime-3.0.11-android-x64-preview.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose dist/android/MusicTime-3.0.11-android-arm64-preview.apk
          (cd dist/android && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: music-time-android-3.0.11-preview
          path: dist/android/
          retention-days: 14
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare branding and pinned dependencies
        run: |
          uname -m
          xcodebuild -version
          for size in 16 32 64 128 256 512 1024; do
            sips -z "$size" "$size" assets/branding/icon.png --out "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_$size.png" >/dev/null
          done
          flutter pub get --enforce-lockfile
      - name: Build macOS preview
        run: flutter build macos --release --no-pub
      - name: Validate and package macOS preview
        run: |
          APP='build/macos/Build/Products/Release/Music Time Preview.app'
          test -d "$APP"
          mkdir -p dist/macos
          lipo -archs "$APP/Contents/MacOS/Music Time Preview" | tee dist/macos/architectures.txt
          codesign --verify --deep --verbose "$APP"
          "$APP/Contents/MacOS/Music Time Preview" >dist/macos/startup.log 2>&1 &
          PID=$!
          sleep 20
          kill -0 "$PID"
          if grep -E 'Unhandled Exception|Library not loaded|Symbol not found' dist/macos/startup.log; then kill "$PID"; exit 1; fi
          kill "$PID"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/macos/MusicTime-3.0.11-macos-preview.zip
          (cd dist/macos && shasum -a 256 *.zip > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: music-time-macos-3.0.11-preview
          path: dist/macos/
          retention-days: 14
