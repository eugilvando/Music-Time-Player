name: Android preview startup
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Platform previews run with APK artifact
        required: true
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: music-time-android-3.0.11-preview
          path: packages
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Prepare Android emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n music_time_smoke -k 'system-images;android-35;google_apis;x86_64' --device pixel_2
          sudo chmod 666 /dev/kvm
          mkdir -p evidence
          "$ANDROID_HOME/emulator/emulator" -avd music_time_smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 5
          if ! kill -0 "$EMULATOR_PID"; then cat evidence/emulator.log; exit 1; fi
          timeout 90 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
      - name: Install and launch release APK
        run: |
          (cd packages && sha256sum -c SHA256SUMS-android.txt)
          adb install packages/MusicTime-3.0.11-android-x64-preview.apk
          adb logcat -c
          adb shell am start -W -n app.musictime.player.preview/.MainActivity | tee evidence/launch.txt
          sleep 30
          adb shell pidof app.musictime.player.preview | tee evidence/pid.txt
          test -s evidence/pid.txt
          adb logcat -d > evidence/logcat.txt
          adb exec-out screencap -p > evidence/startup.png
          if grep -E 'FATAL EXCEPTION|Unhandled Exception|Fatal signal|Unable to load asset|MissingPluginException' evidence/logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-preview-startup-evidence
          path: evidence/
          retention-days: 14
