name: Ubuntu preview package
on:
  push:
    branches: [codex/ubuntu-preview-2.5.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux distribution inputs
        run: |
          test -f scripts/launch-ubuntu.sh
          test -f scripts/package-ubuntu.sh
          test -f scripts/smoke-ubuntu.sh
          bash -n scripts/launch-ubuntu.sh scripts/package-ubuntu.sh scripts/smoke-ubuntu.sh
      - name: Install build and runtime dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$source"; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install --no-install-recommends -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libsecret-1-dev libx11-dev libxi-dev libxrandr-dev libmpv-dev mpv libsqlite3-dev libglu1-mesa xvfb dbus-x11 gnome-keyring xdotool imagemagick
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages and analyze
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter analyze --no-pub
      - name: Test current catalog and UI refinements
        run: flutter test --no-pub --concurrency=1 test/disc_metadata_test.dart test/cloud_metadata_test.dart test/catalog_test.dart test/album_review_test.dart test/memory_artwork_test.dart test/refinements_2_4_test.dart test/refinements_2_4_1_test.dart test/player_bar_organizer_test.dart test/library_visibility_test.dart test/source_removal_test.dart test/onedrive_sync_test.dart test/artist_radio_refinements_test.dart test/catalog_query_test.dart test/home_cache_test.dart test/refinements_2_5_test.dart test/refinements_2_5_2_test.dart
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Validate graphical launch and database migration
        run: xvfb-run -a dbus-run-session -- bash scripts/smoke-ubuntu.sh
      - name: Package deb
        run: bash scripts/package-ubuntu.sh
      - name: Install preview and test VM rendering modes
        run: |
          sudo apt-get install -y ./dist/ubuntu/*.deb
          dpkg-query -W -f='${Version}\n' music-time-preview
          for mode in compatibility software; do
            MUSIC_TIME_RENDERER="$mode" MUSIC_TIME_SMOKE_BINARY=/usr/bin/music-time-preview xvfb-run -a dbus-run-session -- bash scripts/smoke-ubuntu.sh
          done
      - name: Upload VM package
        uses: actions/upload-artifact@v4
        with:
          name: music-time-ubuntu-24.04-amd64-2.5.4-preview1
          path: dist/ubuntu/
          retention-days: 14
      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-2.5.4-preview1-validation
          path: build/ubuntu-smoke/
          if-no-files-found: ignore
