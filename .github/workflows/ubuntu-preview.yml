name: Ubuntu preview package
on:
  push:
    branches: [codex/ubuntu-preview-2.2.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libsecret-1-dev libx11-dev libxi-dev libxrandr-dev libmpv-dev mpv libsqlite3-dev libglu1-mesa xvfb dbus-x11 gnome-keyring xdotool imagemagick
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages and analyze
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter analyze --no-pub
      - name: Test metadata and catalog rules
        run: flutter test --no-pub --concurrency=1 test/disc_metadata_test.dart test/cloud_metadata_test.dart test/catalog_test.dart
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Validate graphical launch and database migration
        run: xvfb-run -a dbus-run-session -- bash scripts/smoke-ubuntu.sh
      - name: Package deb
        run: bash scripts/package-ubuntu.sh
      - name: Upload VM package
        uses: actions/upload-artifact@v4
        with:
          name: music-time-ubuntu-24.04-amd64-preview
          path: dist/ubuntu/
          retention-days: 14
      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-preview-validation
          path: build/ubuntu-smoke/
          if-no-files-found: ignore
