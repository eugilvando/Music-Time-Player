name: Ubuntu release package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu-preview.yml'
      - 'linux/**'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.*'
      - 'scripts/*ubuntu.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux distribution inputs
        run: |
          test -f scripts/launch-ubuntu.sh
          test -f scripts/package-ubuntu.sh
          test -f scripts/smoke-ubuntu.sh
          bash -n scripts/launch-ubuntu.sh scripts/package-ubuntu.sh scripts/smoke-ubuntu.sh
      - name: Install build and runtime dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$source"; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install --no-install-recommends -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libsecret-1-dev libx11-dev libxi-dev libxrandr-dev libmpv-dev mpv pulseaudio pulseaudio-utils libsqlite3-dev libglu1-mesa xvfb dbus-x11 gnome-keyring xdotool imagemagick x11-utils desktop-file-utils
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages and analyze
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter analyze --no-pub
      - name: Test current catalog and UI refinements
        env:
          MUSIC_TIME_LIBMPV: /usr/lib/x86_64-linux-gnu/libmpv.so.2
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
          flutter test --no-pub --concurrency=1 test/disc_metadata_test.dart test/cloud_metadata_test.dart test/catalog_test.dart test/album_review_test.dart test/memory_artwork_test.dart test/refinements_2_4_test.dart test/refinements_2_4_1_test.dart test/player_bar_organizer_test.dart test/library_visibility_test.dart test/source_removal_test.dart test/onedrive_sync_test.dart test/artist_radio_refinements_test.dart test/catalog_query_test.dart test/home_cache_test.dart test/refinements_2_5_test.dart test/refinements_2_5_2_test.dart test/lastfm_favorite_sync_test.dart test/tray_window_test.dart test/ui_0_7_1_test.dart test/ui_1_1_test.dart test/playback_update_test.dart test/insight_tags_test.dart test/continuous_bar_test.dart test/windows_audio_output_test.dart test/parametric_eq_test.dart test/output_equalizer_test.dart test/album_queue_drag_test.dart test/playback_settings_test.dart test/output_equalizer_panel_test.dart test/artist_update_test.dart test/artist_mix_entry_test.dart test/artist_selection_test.dart test/artist_selection_ui_test.dart test/icon_pack_test.dart test/intelligent_queue_test.dart test/intelligent_playback_test.dart test/library_3_test.dart test/library_cards_test.dart test/catalog_widget_test.dart
      - name: Test real MPRIS session bus
        env:
          MUSIC_TIME_LIBMPV: /usr/lib/x86_64-linux-gnu/libmpv.so.2
        run: dbus-run-session -- flutter test --no-pub test/linux_media_test.dart
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Validate graphical launch and database migration
        run: xvfb-run -a dbus-run-session -- bash scripts/smoke-ubuntu.sh
      - name: Validate native media controls
        run: xvfb-run -a dbus-run-session -- bash scripts/mpris-ubuntu.sh
      - name: Package deb
        run: bash scripts/package-ubuntu.sh
      - name: Install package and test VM rendering modes
        run: |
          sudo apt-get install -y ./dist/ubuntu/*.deb
          dpkg-query -W -f='${Version}\n' music-time-preview
          desktop-file-validate /usr/share/applications/app.musictime.preview.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/app.musictime.preview.png
          test ! -f /usr/share/applications/music-time-preview.desktop
          for mode in compatibility software; do
            MUSIC_TIME_RENDERER="$mode" MUSIC_TIME_SMOKE_BINARY=/usr/bin/music-time-preview xvfb-run -a dbus-run-session -- bash scripts/smoke-ubuntu.sh
          done
      - name: Upload VM package
        uses: actions/upload-artifact@v4
        with:
          name: music-time-ubuntu-24.04-amd64-3.0.2-final
          path: dist/ubuntu/
          retention-days: 14
      - name: Upload Linux validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-3.0.2-final-validation
          path: build/ubuntu-smoke/
          if-no-files-found: ignore
