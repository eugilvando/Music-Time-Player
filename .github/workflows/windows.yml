name: Windows validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: flutter build windows --release
      - name: Run baseline tests
        shell: pwsh
        run: |
          $env:MUSIC_TIME_LIBMPV = Join-Path $PWD 'build/windows/x64/runner/Release/libmpv-2.dll'
          $env:PATH = (Split-Path $env:MUSIC_TIME_LIBMPV) + ';' + $env:PATH
          if (-not (Test-Path $env:MUSIC_TIME_LIBMPV)) { throw 'Missing audio runtime' }
          if (-not (Test-Path (Join-Path (Split-Path $env:MUSIC_TIME_LIBMPV) 'vulkan-1.dll'))) { throw 'Missing Vulkan loader' }
          flutter test --no-pub --concurrency=1
