name: music_time
description: Personal music player with local, cloud and media server sources.
publish_to: none
version: 1.2.1+41
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  file_selector: ^1.0.3
  http: ^1.3.0
  xml: ^7.0.1
  crypto: ^3.0.6
  ffi: ^2.2.0
  win32: ^6.4.0
  shared_preferences: ^2.5.6
  sqflite_common_ffi: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  audio_metadata_reader: ^1.8.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  flutter_media_session: ^3.0.9
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/branding/
